<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %BASE_URL% is substituted by Vite with the `base` set in
         vite.config.ts at build time — use it for every reference to a
         file in /public so paths stay correct under the GitHub Pages
         subdirectory (see vite.config.ts and README.md). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Klero | Heritage Carried Forward</title>
    <meta
      name="description"
      content="Klero brings together cooking, baking, hospitality, and family tradition — preserving meaningful recipes and sharing them with a new generation."
    />
    <meta name="theme-color" content="#3E2723" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klero" />
    <meta property="og:title" content="Klero | Heritage Carried Forward" />
    <meta
      property="og:description"
      content="Food carried from one generation to the next. Klero preserves recipes, hospitality, and tradition — cooking and baking made with meaning."
    />
    <meta property="og:image" content="%BASE_URL%og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klero | Heritage Carried Forward" />
    <meta
      name="twitter:description"
      content="Food carried from one generation to the next. Klero preserves recipes, hospitality, and tradition."
    />
    <meta name="twitter:image" content="%BASE_URL%og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
